name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    name: Syntax check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Syntax check (server modules)
        run: npm run syntax

  smoke:
    name: Smoke tests (API)
    runs-on: ubuntu-latest
    needs: syntax
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prepare data directory
        run: |
          mkdir -p data public/uploads
          echo "SOM_TUM_DATA=${{ github.workspace }}/data" >> $GITHUB_ENV
          echo "PORT=3080" >> $GITHUB_ENV
          echo "JWT_SECRET=ci-test-secret-not-for-production" >> $GITHUB_ENV

      - name: Start server
        run: |
          node server/index.js > /tmp/somtum-server.log 2>&1 &
          echo $! > /tmp/somtum-server.pid
          # wait until healthy (max ~30s)
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3080/api/health >/dev/null; then
              echo "Server is up"
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to start"
          cat /tmp/somtum-server.log || true
          exit 1

      - name: Run smoke tests
        run: npm test
        env:
          BASE_URL: http://127.0.0.1:3080

      - name: Stop server
        if: always()
        run: |
          if [ -f /tmp/somtum-server.pid ]; then
            kill "$(cat /tmp/somtum-server.pid)" 2>/dev/null || true
          fi
          cat /tmp/somtum-server.log || true

  customer-page:
    name: Customer page isolation
    runs-on: ubuntu-latest
    needs: syntax
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Customer HTML must not expose merchant login UI
        run: |
          set -e
          # หน้าลูกค้าต้องไม่มีข้อความล็อกอินพนักงาน
          if grep -q "เข้าสู่ระบบพนักงาน" public/customer.html; then
            echo "ERROR: customer.html contains merchant login text"
            exit 1
          fi
          # หน้าลูกค้าต้องมี flow สั่งอาหาร
          grep -q "ตะกร้า\|สั่งอาหาร\|เพิ่มลงตะกร้า" public/customer.html
          # หน้าร้านค้าต้องมี login
          grep -q "เข้าสู่ระบบ" public/merchant.html
          echo "Customer/merchant separation OK"
